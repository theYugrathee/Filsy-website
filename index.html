    <meta name="msvalidate.01" content="C23976B5296F6A25B3BA1CC32F56E717" />
    <!-- Add your Google Search Console verification token below: -->
    <!-- <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_TOKEN" /> -->

    <!-- Instant Theme Init Script (Zero Flash: Default Light Mode) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('filsy_theme') || localStorage.getItem('filsy_theme_mode');
          var theme = (stored === 'dark' || stored === 'light') ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Typography: Fonts loaded with display=swap for Core Web Vitals (FCP/LCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
